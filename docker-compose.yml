services:
  subtitle-app:
    build: .
    image: subtitle-correction:latest
    container_name: subtitle-correction
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # 容器内监听端口固定 3000；宿主机映射端口用 HOST_PORT 覆盖
      PORT: 3000
      DATA_DIR: /data
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}"
    volumes:
      - subtitle-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  subtitle-data:
